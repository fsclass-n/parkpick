# =============================================================
# Render Blueprint (Infrastructure as Code)
# - Render 대시보드 > New > Blueprint 에서 이 저장소를 한 번 연결하면,
#   이후 main 브랜치 push 시 Render Git 연동으로 자동 배포됩니다. (Deploy Hook 미사용)
# - autoDeployTrigger: checksPass → GitHub Actions CI(.github/workflows/deploy.yml) 통과 후에만 배포
# - buildFilter / rootDir → 각 서비스 영역 파일이 변경될 때만 개별 배포
# - sync: false 항목은 Render 대시보드에서 직접 값을 입력합니다. (.env.example 의 [RENDER-*] 표시 참고)
# =============================================================
services:
  # ---------- 백엔드 API: https://parkpick-api.onrender.com ----------
  - type: web
    name: parkpick-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        - backend/tests/**
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://parkpick.onrender.com,https://parkpick.netlify.app,http://localhost:5173
      - key: FRONTEND_URL
        value: https://parkpick.onrender.com
      - key: BACKEND_URL
        value: https://parkpick-api.onrender.com
      - key: SIMULATOR_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_INGEST_TOKEN
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false

  # ---------- 프런트엔드: https://parkpick.onrender.com ----------
  - type: web
    name: parkpick
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - frontend/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_USE_MOCK
        value: "false"
      - key: VITE_API_BASE_URL
        value: https://parkpick-api.onrender.com
